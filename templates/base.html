<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ConcefSA{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #2196f3 0%, #e3f2fd 100%);
            min-height: 100vh;
        }
        .navbar {
            box-shadow: 0 2px 8px rgba(33,150,243,0.08);
        }
        .content {
            margin-top: 40px;
        }
        .card {
            border-radius: 18px;
            box-shadow: 0 4px 24px rgba(33,150,243,0.10);
        }
        .btn-primary, .btn-outline-primary.active {
            background: linear-gradient(90deg, #1976d2 0%, #64b5f6 100%);
            border: none;
        }
        .btn-primary:hover {
            background: linear-gradient(90deg, #1565c0 0%, #42a5f5 100%);
        }
        .footer {
            background: #f8f9fa;
            border-top: 1px solid #e3e3e3;
            padding: 18px 0 0 0;
            margin-top: 60px;
        }
        .navbar-brand {
            font-weight: bold;
            font-size: 1.5rem;
            letter-spacing: 1px;
        }
        .nav-link.active, .nav-link:focus {
            color: #1976d2 !important;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('home') }}">ConcefSA <span style="font-size:1.2em;">🛣️</span></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    {% if current_user.is_authenticated %}
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('payment.saldo') }}"><span style="font-size:1.2em;">💰</span> Saldo</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('payment.recarga') }}"><span style="font-size:1.2em;">➕</span> Recarga</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('passage.historico') }}"><span style="font-size:1.2em;">📜</span> Histórico</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('auth.logout') }}"><span style="font-size:1.2em;">🚪</span> Sair</a></li>
                    {% else %}
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('login') }}">Login</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('cadastro') }}">Cadastro</a></li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>
    <div class="content">
        {% block content %}{% endblock %}
    </div>
    <footer class="footer mt-5">
        <div class="container text-center">
            <p class="mb-0">&copy; 2024 ConcefSA. Todos os direitos reservados.</p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
