{% extends 'base.html' %}
{% block title %}Configurar 2FA{% endblock %}
{% block content %}
<div class="container mt-5">
    <div class="card p-4 shadow mx-auto" style="max-width: 500px;">
        <h2 class="mb-4 text-center">Configurar Autenticação de Dois Fatores</h2>
        <form method="POST" action="{{ url_for('configurar_2fa') }}">
            <input type="hidden" name="acao" value="ativar">
            <button type="submit" class="btn btn-success w-100 mb-3">Ativar 2FA</button>
        </form>
        {% if qr_code and chave %}
        <div class="text-center mb-3">
            <img src="data:image/png;base64,{{ qr_code }}" alt="QR Code 2FA">
            <p class="mt-2">Chave: <code>{{ chave }}</code></p>
        </div>
        <form method="POST" action="{{ url_for('configurar_2fa') }}">
            <input type="hidden" name="acao" value="confirmar">
            <div class="mb-3">
                <label for="codigo" class="form-label">Código do App:</label>
                <input type="text" class="form-control" id="codigo" name="codigo" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Confirmar 2FA</button>
        </form>
        {% endif %}
        <form method="POST" action="{{ url_for('configurar_2fa') }}" class="mt-3">
            <input type="hidden" name="acao" value="desativar">
            <button type="submit" class="btn btn-danger w-100">Desativar 2FA</button>
        </form>
        <div class="mt-3 text-center">
            <a href="{{ url_for('home') }}">Voltar ao Início</a>
        </div>
    </div>
</div>
{% endblock %}
