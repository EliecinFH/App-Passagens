{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <div class="card p-4 shadow">
        <h2 class="mb-4">Recarga de Saldo</h2>
        <form method="POST" action="{{ url_for('payment.recarga') }}">
            <div class="mb-3">
                <label for="valor_recarga" class="form-label">Valor da Recarga:</label>
                <input type="number" step="0.01" min="1" class="form-control" id="valor_recarga" name="valor_recarga" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Recarregar</button>
        </form>
        <a href="{{ url_for('payment.saldo') }}" class="btn btn-secondary mt-3">Voltar</a>
    </div>
</div>
{% endblock %}
