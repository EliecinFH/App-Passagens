{% extends 'base.html' %}
{% block title %}Saldo{% endblock %}
{% block content %}
<div class="container mt-5">
    <div class="card p-4 shadow mx-auto" style="max-width: 400px;">
        <h2 class="mb-4 text-center">Seu Saldo <span title="Saldo"><span style="font-size:1.2em;">💰</span></span></h2>
        <div class="saldo mb-4 display-4 text-center">R$ {{ saldo }}</div>
        <div class="d-flex flex-column flex-md-row justify-content-center gap-3">
            <a href="{{ url_for('meio_pagamento') }}" class="btn btn-primary">
                <span style="font-size:1.2em;">➕</span> Adicionar Saldo
            </a>
            <a href="{{ url_for('passage.historico') }}" class="btn btn-outline-primary">
                <span style="font-size:1.2em;">📜</span> Ver Histórico
            </a>
            <a href="{{ url_for('auth.logout') }}" class="btn btn-secondary">
                <span style="font-size:1.2em;">🚪</span> Sair
            </a>
        </div>
    </div>
</div>
{% endblock %}
