{% extends 'base.html' %}
{% block title %}Verificação 2FA{% endblock %}
{% block content %}
<div class="container mt-5">
    <div class="card p-4 shadow mx-auto" style="max-width: 400px;">
        <h2 class="mb-4 text-center">Autenticação de Dois Fatores</h2>
        <form method="POST" action="{{ url_for('verificar_2fa') }}">
            <div class="mb-3">
                <label for="codigo" class="form-label">Código 2FA:</label>
                <input type="text" class="form-control" id="codigo" name="codigo" required autofocus>
            </div>
            <button type="submit" class="btn btn-primary w-100">Verificar</button>
        </form>
        <div class="mt-3 text-center">
            <a href="{{ url_for('login') }}">Voltar ao Login</a>
        </div>
    </div>
</div>
{% endblock %}
