{% extends 'base.html' %}
{% block title %}Meios de Pagamento{% endblock %}
{% block content %}
<div class="container mt-5">
    <div class="card p-4 shadow mx-auto" style="max-width: 500px;">
        <h2 class="mb-4 text-center">Meios de Pagamento</h2>
        <form method="POST" action="{{ url_for('meio_pagamento') }}">
            <div class="mb-3">
                <label for="chave_pix" class="form-label">Chave PIX:</label>
                <input type="text" class="form-control" id="chave_pix" name="chave_pix" required>
            </div>
            <div class="mb-3">
                <label for="valor" class="form-label">Valor:</label>
                <input type="number" step="0.01" min="0.01" class="form-control" id="valor" name="valor" required>
            </div>
            <button type="submit" class="btn btn-success w-100">Realizar Pagamento PIX</button>
        </form>
        <hr>
        <h4 class="mt-4">Outros Meios de Pagamento</h4>
        <ul class="list-group">
            {% for meio in meios_pagamento %}
                <li class="list-group-item">{{ meio.nome }}</li>
            {% endfor %}
        </ul>
    </div>
</div>
{% endblock %}
