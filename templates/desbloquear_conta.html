{% extends 'base.html' %}
{% block title %}Desbloquear Conta{% endblock %}
{% block content %}
<div class="container mt-5">
    <div class="card p-4 shadow mx-auto" style="max-width: 400px;">
        <h2 class="mb-4 text-center">Desbloquear Conta</h2>
        <form method="POST" action="{{ url_for('desbloquear_conta') }}">
            <div class="mb-3">
                <label for="email" class="form-label">E-mail:</label>
                <input type="email" class="form-control" id="email" name="email" required>
            </div>
            <div class="mb-3">
                <label for="senha_temp" class="form-label">Senha Temporária:</label>
                <input type="text" class="form-control" id="senha_temp" name="senha_temp" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Desbloquear</button>
        </form>
        <div class="mt-3 text-center">
            <a href="{{ url_for('login') }}">Voltar ao Login</a>
        </div>
    </div>
</div>
{% endblock %}
