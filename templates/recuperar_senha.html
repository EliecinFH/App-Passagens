{% extends 'base.html' %}
{% block title %}Recuperar Senha{% endblock %}
{% block content %}
<div class="container mt-5">
    <div class="card p-4 shadow mx-auto" style="max-width: 400px;">
        <h2 class="mb-4 text-center">Recuperar Senha</h2>
        <form method="POST" action="{{ url_for('recuperar_senha') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label for="email" class="form-label">E-mail cadastrado:</label>
                <input type="email" class="form-control" id="email" name="email" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Recuperar</button>
        </form>
        {% if senha_temporaria %}
        <div class="alert alert-info mt-3 text-center">
            <strong>Sua senha temporária:</strong><br>
            <span style="font-size:1.2em;">{{ senha_temporaria }}</span>
        </div>
        {% endif %}
        <div class="mt-3 text-center">
            <a href="{{ url_for('login') }}">Voltar ao login</a>
        </div>
    </div>
</div>
{% endblock %}
